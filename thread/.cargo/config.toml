[target.'cfg(all(target_arch = "arm", target_os = "none"))']
rustflags = [
  "-C", "linker=flip-link", # adds stack overflow protection
  "-C", "link-arg=-Tdefmt.x", # defmt support
]

[target.thumbv7em-none-eabihf]
runner = ["cargo", "run", "--quiet", "--package", "dfu", "--target", "host-tuple", "--", "flash", "--soft-device", "../s140_nrf52_7.3.0_softdevice.hex"]
rustflags = [
  "-C", "link-arg=-Tlink.x", "-C", "linker=lld",
]

[build]
target = "thumbv7em-none-eabihf" # = ARM Cortex-M4
