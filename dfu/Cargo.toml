[package]
name = "dfu"
version = "0.1.0"
edition = { workspace = true }
workspace = ".."
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crc32fast = "1.5.4"
ihex = "3.0.0"
object = { version = "0.40.0", default-features = false, features = ["elf", "read_core", "std"] }
serialport = "4.10.1"
sha2 = "0.11.1"
